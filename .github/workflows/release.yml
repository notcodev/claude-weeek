name: Release

on:
  push:
    branches: [main]

# Never run two releases at once; let an in-flight publish finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags, push the release commit, create GitHub Releases
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # OIDC for npm trusted publishing + automatic provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so commit-analyzer can find the last release
          persist-credentials: false # semantic-release authenticates via GITHUB_TOKEN itself

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version is read from the "packageManager" field

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 24.10 ships npm >= 11.6, required for OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
